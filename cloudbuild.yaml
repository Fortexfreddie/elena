steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/elena-web', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/elena-web']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elena-web'
      - '--image=gcr.io/$PROJECT_ID/elena-web'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--max-instances=40'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elena-worker'
      - '--image=gcr.io/$PROJECT_ID/elena-web'
      - '--region=us-central1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--memory=2Gi'
      - '--set-env-vars=PROCESS_TYPE=worker'
      - '--command=node'
      - '--args=dist/worker.js'
